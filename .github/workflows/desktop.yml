name: desktop apps

# Builds the all-in-one Recap desktop app (Electron + bundled engine + ffmpeg + whisper.cpp)
# on each OS's own runner. Tags (v*) attach the installers to the GitHub release.
on:
  push:
    branches: [main]
    paths: ["desktop/**", "src/**", "package*.json", "next.config.ts", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-15, args: "--mac --arm64", files: "desktop/dist/Recap-mac-*.dmg" }
          - { name: windows, os: windows-latest, args: "--win --x64", files: "desktop/dist/Recap-windows-*.exe" }
          # 22.04 (glibc 2.35) so the AppImage/whisper binary run on older distros too.
          - { name: linux, os: ubuntu-22.04, args: "--linux --x64", files: "desktop/dist/Recap-linux-*.AppImage\ndesktop/dist/Recap-linux-*.deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        shell: bash
        run: |
          npm ci
          cd desktop && npm ci && node node_modules/electron/install.js

      - name: Bundled binaries (pinned ffmpeg + whisper.cpp + llama.cpp built from source)
        shell: bash
        working-directory: desktop
        run: npm run bins

      - name: Engine (Recap server, standalone build)
        shell: bash
        working-directory: desktop
        run: npm run engine

      - name: Package
        if: matrix.name != 'windows' || vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Windows code signing through SignPath (free for open source; see docs/CODE_SIGNING.md). Off until the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist. Three requests:
      # the whole app folder (Recap, its helpers, ffmpeg/whisper/llama and DLLs), then the uninstaller and the
      # installer, which electron-builder creates mid-build (scripts/signpath-bridge.cjs hands them over).
      - name: "Signing 1/3: build the app folder"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --dir --publish never
      - name: "Signing 1/3: upload the app folder"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-unsigned
          path: desktop/dist/win-unpacked
          if-no-files-found: error
      - name: "Signing 1/3: sign the app folder"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'recap' }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/dist/win-signed
      - name: "Signing 1/3: use the signed app folder"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        working-directory: desktop
        run: |
          rm -rf dist/win-unpacked && mv dist/win-signed dist/win-unpacked
          node scripts/signpath-bridge.cjs check dist/win-unpacked
      - name: "Signing 2/3 and 3/3: build the installer (waits for the uninstaller and installer to be signed)"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/signpath-bridge.cjs build --win nsis --x64 --prepackaged dist/win-unpacked --publish never "-c.win.signtoolOptions.sign=./scripts/signpath-bridge.cjs"
      - name: "Signing 2/3: wait for the uninstaller"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: req1
        shell: bash
        working-directory: desktop
        run: echo "dir=$(node scripts/signpath-bridge.cjs wait 1)" >> "$GITHUB_OUTPUT"
      - name: "Signing 2/3: upload the uninstaller"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: req1-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-uninstaller-unsigned
          path: ${{ steps.req1.outputs.dir }}
          if-no-files-found: error
      - name: "Signing 2/3: sign the uninstaller"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'recap' }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows-file
          github-artifact-id: ${{ steps.req1-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-1
      - name: "Signing 2/3: hand it back"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        working-directory: desktop
        run: node scripts/signpath-bridge.cjs accept 1 "$RUNNER_TEMP/signed-1"
      - name: "Signing 3/3: wait for the installer"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: req2
        shell: bash
        working-directory: desktop
        run: echo "dir=$(node scripts/signpath-bridge.cjs wait 2)" >> "$GITHUB_OUTPUT"
      - name: "Signing 3/3: upload the installer"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: req2-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: ${{ steps.req2.outputs.dir }}
          if-no-files-found: error
      - name: "Signing 3/3: sign the installer"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'recap' }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows-file
          github-artifact-id: ${{ steps.req2-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-2
      - name: "Signing 3/3: hand it back and finish the installer"
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        working-directory: desktop
        run: |
          node scripts/signpath-bridge.cjs accept 2 "$RUNNER_TEMP/signed-2"
          node scripts/signpath-bridge.cjs finish
          node -e "const {isSigned}=require('./scripts/signpath-bridge.cjs'); if(!isSigned('dist/Recap-windows-x64-setup.exe')) { console.error('installer is not signed'); process.exit(1) }; console.log('installer signed')"

      # The full self-test (security, record→library→transcribe, clean cut, export, recovery, delete)
      # against the packaged app on every OS. The sample video is made with the bundled ffmpeg.
      - name: Self-test the packaged app
        shell: bash
        working-directory: desktop
        run: |
          set -u
          FF=bin/ffmpeg; [ -f bin/ffmpeg.exe ] && FF=bin/ffmpeg.exe
          OUT="$RUNNER_TEMP/selftest"; mkdir -p "$OUT"
          # A realistic sample: synthesized speech with fillers and pauses (so transcription and the clean cut
          # have real work), 30 s of 1080p H.264 at ~4 Mbps (~15 MB, well over the 10 MB that once truncated uploads).
          TEXT="Hi team, um, quick update on the launch. So, uh, the recorder works now. And, like, you can share a link. Um, let me know what you think."
          SPEECH="$RUNNER_TEMP/speech.wav"
          case "${{ matrix.name }}" in
            macos) say -o "$RUNNER_TEMP/speech.aiff" "$TEXT" && "$FF" -y -loglevel error -i "$RUNNER_TEMP/speech.aiff" "$SPEECH" ;;
            linux) sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null && espeak-ng -w "$SPEECH" "$TEXT" ;;
            windows) powershell -NoProfile -Command "Add-Type -AssemblyName System.Speech; \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$s.SetOutputToWaveFile('$(cygpath -w "$SPEECH")'); \$s.Speak('$TEXT'); \$s.Dispose()" ;;
          esac
          "$FF" -y -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -stream_loop -1 -i "$SPEECH" -af "apad=pad_dur=2" -t 30 \
            -c:v libx264 -preset veryfast -b:v 4M -c:a libopus "$RUNNER_TEMP/sample.mkv"
          ls -l "$RUNNER_TEMP/sample.mkv"
          export RECAP_SELFTEST_EXPECT_CUTS=1
          # On-device AI: download the polish model through the app (checksum verified) into a scratch path, then polish a guide.
          export RECAP_SELFTEST_POLISH=1 RECAP_POLISH_MODEL="$RUNNER_TEMP/polish-model.gguf"
          # Windows and Linux: install the real installer people download, test the installed copy, and make a
          # real screen recording through the recorder (macOS runners can't grant screen access).
          case "${{ matrix.name }}" in
            linux)
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
              sudo apt-get install -y -qq ./dist/Recap-linux-amd64.deb >/dev/null
              BIN=$(dpkg -L recap-desktop | grep -E '^/opt/.+/recap-desktop$' | head -1)
              echo "installed: $BIN"; [ -n "$BIN" ]
              export RECAP_SELFTEST_CAPTURE=1 RECAP_SELFTEST_FAKE_MEDIA=1
              APP=(xvfb-run -a -s "-screen 0 1920x1080x24" "$BIN" --no-sandbox) ;;
            macos)
              # The app people download: mount the DMG and run the copy inside it.
              hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/Recap-mac-arm64.dmg
              cp -R "$RUNNER_TEMP/dmg/Recap.app" "$RUNNER_TEMP/Recap.app"; hdiutil detach "$RUNNER_TEMP/dmg"
              codesign --verify --deep --strict "$RUNNER_TEMP/Recap.app" && echo "signature valid"
              APP=("$RUNNER_TEMP/Recap.app/Contents/MacOS/Recap") ;;
            windows)
              DEST="$RUNNER_TEMP/RecapInstalled"
              cmd.exe //c "dist\\Recap-windows-x64-setup.exe /S /D=$(cygpath -w "$DEST")"
              for i in $(seq 1 60); do [ -f "$DEST/Recap.exe" ] && break; sleep 2; done
              ls "$DEST" | head; echo "installed: $DEST/Recap.exe"
              export RECAP_SELFTEST_CAPTURE=1 RECAP_SELFTEST_FAKE_MEDIA=1
              APP=("$DEST/Recap.exe") ;;
          esac
          # macOS has no `timeout`; perl's alarm does the same job there.
          if command -v timeout >/dev/null; then LIMIT=(timeout 900); else LIMIT=(perl -e 'alarm shift; exec @ARGV' 900); fi
          RECAP_SELFTEST="$OUT" RECAP_SELFTEST_FILE="$RUNNER_TEMP/sample.mkv" "${LIMIT[@]}" "${APP[@]}" || true
          cat "$OUT/report.json"
          PY=$(command -v python3 || command -v python)
          "$PY" -c "import json,sys; r=json.load(open(sys.argv[1])); bad=[s for s in r['steps'] if not s['ok']]; print('FAILED:', bad) if bad else print('all', len(r['steps']), 'steps passed'); sys.exit(1 if bad or not r['steps'] else 0)" "$OUT/report.json"

      - name: Every installed Windows file is signed
        if: matrix.name == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        working-directory: desktop
        run: node scripts/signpath-bridge.cjs check "$RUNNER_TEMP/RecapInstalled"

      - name: Lifecycle (update notice, upgrade in place, AppImage, uninstall)
        if: matrix.name != 'macos'
        shell: bash
        working-directory: desktop
        run: |
          set -euxo pipefail
          OLD=v0.4.1   # an older release, so it must announce the latest one
          HOME_DIR="$RUNNER_TEMP/lifecycle-home"
          probe() { node scripts/ci-panel.mjs 9333 | tee "$RUNNER_TEMP/panel.json"; }
          # The app checks GitHub's API anonymously; shared runners sometimes have that quota used up, in which
          # case no app could see the update. Only then is a missing notice not a failure.
          update_shown() {
            grep -q '"updateShown":true' "$RUNNER_TEMP/panel.json" && return 0
            # On a tag build the new release is still being assembled (other OS jobs create it before this one
            # attaches its installer), and the app rightly won't announce a release it can't download.
            [[ "$GITHUB_REF" == refs/tags/* ]] && { echo "::warning::update notice not checked on a tag build (release still uploading)"; return 0; }
            left=$(curl -s https://api.github.com/rate_limit | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).resources.core.remaining))')
            [ "$left" = 0 ] && { echo "::warning::update notice not checked: GitHub API rate limit exhausted on this runner"; return 0; }
            return 1
          }
          case "${{ matrix.name }}" in
            windows)
              DEST="$RUNNER_TEMP/RecapLifecycle"; W=$(cygpath -w "$DEST")
              curl -sSL -o old-setup.exe "https://github.com/Aditya-galaxy/recap/releases/download/$OLD/Recap-windows-x64-setup.exe"
              ver() { powershell -NoProfile -Command "(Get-Item '$W\\Recap.exe').VersionInfo.ProductVersion"; }
              install() { cmd.exe //c "$1 /S /D=$W"; for i in $(seq 1 60); do [ -f "$DEST/Recap.exe" ] && break; sleep 2; done; sleep 3; }
              run() { RECAP_DEV_HOME="$HOME_DIR" "$DEST/Recap.exe" --remote-debugging-port=9333 > "$RUNNER_TEMP/app.log" 2>&1 & sleep 25; probe; taskkill //IM Recap.exe //F >/dev/null 2>&1 || true; sleep 3; }
              install old-setup.exe; echo "old installed: $(ver)"
              run; update_shown
              install "dist\\Recap-windows-x64-setup.exe"; NEW=$(ver); echo "after upgrade: $NEW"
              [[ "$NEW" == "$(node -p "require('./package.json').version")"* ]]   # Windows adds a fourth part: 0.4.3.0
              run; grep -q '"panel":true' "$RUNNER_TEMP/panel.json"; grep -q '"engine":"ready"' "$RUNNER_TEMP/panel.json"
              powershell -NoProfile -Command "Start-Process -Wait -FilePath '$W\\Uninstall Recap.exe' -ArgumentList '/S'"
              for i in $(seq 1 60); do [ ! -f "$DEST/Recap.exe" ] && break; sleep 2; done
              [ ! -f "$DEST/Recap.exe" ] && echo "uninstalled"
              ;;
            linux)
              sudo apt-get remove -y -qq recap-desktop >/dev/null || true
              curl -sSL -o old.deb "https://github.com/Aditya-galaxy/recap/releases/download/$OLD/Recap-linux-amd64.deb"
              sudo apt-get install -y -qq ./old.deb >/dev/null; echo "old installed: $(dpkg-query -W -f='${Version}' recap-desktop)"
              BIN=$(dpkg -L recap-desktop | grep -E '^/opt/.+/recap-desktop$' | head -1)
              run() { RECAP_DEV_HOME="$HOME_DIR" xvfb-run -a -s "-screen 0 1920x1080x24" "$@" --no-sandbox --remote-debugging-port=9333 > "$RUNNER_TEMP/app.log" 2>&1 & sleep 25; probe; pkill -f remote-debugging-port=9333 || true; sleep 3; }
              run "$BIN"; update_shown
              sudo apt-get install -y -qq ./dist/Recap-linux-amd64.deb >/dev/null; NEW=$(dpkg-query -W -f='${Version}' recap-desktop); echo "after upgrade: $NEW"
              [ "$NEW" = "$(node -p "require('./package.json').version")" ]
              run "$BIN"; grep -q '"engine":"ready"' "$RUNNER_TEMP/panel.json"
              chmod +x dist/Recap-linux-x86_64.AppImage
              APPIMAGE_EXTRACT_AND_RUN=1 run ./dist/Recap-linux-x86_64.AppImage; grep -q '"engine":"ready"' "$RUNNER_TEMP/panel.json"
              sudo apt-get remove -y -qq recap-desktop >/dev/null; [ ! -e "$BIN" ] && echo "uninstalled"
              ;;
          esac

      # Microsoft Store (MSIX) package, built from the same app folder as the installer. The Store signs it on
      # submission; here a throwaway certificate with the Store publisher's subject lets CI install it and run the
      # full self-test inside the package, where file access and identity differ from a normal install.
      - name: Store package (MSIX)
        if: matrix.name == 'windows'
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win appx --x64 --prepackaged dist/win-unpacked --publish never
          ls -l dist/*.appx
      - name: Install the Store package and run the self-test inside it
        if: matrix.name == 'windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $appx = (Get-ChildItem dist\*.appx | Select-Object -First 1).FullName
          $subject = "CN=2CD64894-6E27-45B1-92D6-A47B79A913FC"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject -KeyUsage DigitalSignature -FriendlyName "Recap CI test" -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $secret = ConvertTo-SecureString -String "ci-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\store-test.pfx" -Password $secret | Out-Null
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\store-test.pfx" -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $secret | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $test = "$env:RUNNER_TEMP\recap-store-test.appx"; Copy-Item $appx $test
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\store-test.pfx" /p ci-test $test
          if ($LASTEXITCODE -ne 0) { throw "test signing failed" }
          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage Kronagent.RecapRecorder
          "installed $($pkg.PackageFullName) at $($pkg.InstallLocation)"
          $exe = (Get-ChildItem -Path $pkg.InstallLocation -Recurse -Filter Recap.exe | Select-Object -First 1).FullName
          $out = "$env:RUNNER_TEMP\selftest-store"; New-Item -ItemType Directory -Force $out | Out-Null
          $appArgs = "--recap-env=RECAP_SELFTEST=$out --recap-env=RECAP_SELFTEST_FILE=$env:RUNNER_TEMP\sample.mkv --recap-env=RECAP_SELFTEST_EXPECT_CUTS=1"
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId Recap -Command $exe -Args $appArgs
          for ($i = 0; $i -lt 180 -and -not (Test-Path "$out\report.json"); $i++) { Start-Sleep 5 }
          if (-not (Test-Path "$out\report.json")) { throw "the packaged app produced no self-test report" }
          Start-Sleep 5
          $r = Get-Content "$out\report.json" -Raw | ConvertFrom-Json
          $bad = @($r.steps | Where-Object { -not $_.ok })
          "inside the Store package: store=$($r.store), $($r.steps.Count) steps, $($bad.Count) failed"
          $bad | ForEach-Object { "FAILED: $($_.name) $($_ | ConvertTo-Json -Compress)" }
          if (-not $r.store) { throw "the self-test didn't run inside the package (process.windowsStore was false)" }
          if ($bad.Count) { throw "self-test failures inside the Store package" }
          Remove-AppxPackage $pkg.PackageFullName
      - name: Upload the Store package
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: recap-windows-store
          path: desktop/dist/*.appx

      - name: Upload self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.name }}
          path: ${{ runner.temp }}/selftest/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: recap-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
