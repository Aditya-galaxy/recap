name: server image

on:
  push:
    branches: [main]
    paths-ignore: ["desktop/**", "mac/**", "docs/**", "**.md"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aditya-galaxy/recap

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: recap:test
          build-args: RECAP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (sign up, upload, process, share page)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i "sine=f=300:d=3,apad=pad_dur=3" -t 6 -c:v libvpx -c:a libopus sample.webm
          docker run -d --name recap -p 3000:3000 -e ALLOW_SIGNUP=false recap:test
          for i in $(seq 1 90); do curl -fsS localhost:3000/api/health && break || sleep 3; done
          echo; curl -fsS -o health.json localhost:3000/api/health && grep -q '"ok":true' health.json
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"ci password 123"}' localhost:3000/api/auth/signup
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"x@example.com","password":"ci password 123"}' localhost:3000/api/auth/signup)" = 403
          ID=$(curl -fsS -b jar -H 'x-title: CI%20smoke' --data-binary @sample.webm localhost:3000/api/videos | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 60); do S=$(curl -fsS -b jar localhost:3000/api/videos/$ID | python3 -c "import sys,json;print(json.load(sys.stdin)['meta']['status'])"); [ "$S" = ready ] && break; [ "$S" = error ] && exit 1; sleep 2; done
          test "$S" = ready
          curl -fsS -o page.html localhost:3000/v/$ID && grep -q 'og:title' page.html
          # Clean cut (second ffmpeg pass with a filter-graph file): never covered before, and broken on
          # Debian's ffmpeg 5.1. With pauses enabled at the minimum threshold there's always something to cut.
          curl -fsS -b jar -H 'Content-Type: application/json' -d '{"fillers":true,"silences":true,"minSilence":0.4}' localhost:3000/api/videos/$ID/clean -o clean.json -w '%{http_code}\n' || true
          cat clean.json; echo
          if grep -q '"ok":true' clean.json; then
            for i in $(seq 1 60); do C=$(curl -fsS -b jar localhost:3000/api/videos/$ID | python3 -c "import sys,json;print(json.load(sys.stdin)['meta']['clean']['status'])"); [ "$C" = ready ] && break; [ "$C" = error ] && { curl -fsS -b jar localhost:3000/api/videos/$ID; exit 1; }; sleep 2; done
            test "$C" = ready
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/videos)" = 401
          docker exec recap test ! -e /app/data
          echo "smoke test passed"
      - name: Smoke test, Recap Cloud mode (no server whisper, transcript uploaded with the video)
        run: |
          set -euo pipefail
          docker run -d --name cloud -p 3001:3000 -e CLOUD_MODE=true -e SERVER_TRANSCRIBE=false recap:test
          for i in $(seq 1 60); do curl -fsS localhost:3001/api/health && break || sleep 2; done
          echo; curl -fsS localhost:3001/api/health | grep -q '"ok":true'
          docker exec cloud sh -c 'test -z "$(ls /data/models 2>/dev/null)"'   # model never downloaded
          curl -fsS localhost:3001/api/public/stats | grep -q '"left":100'
          curl -fsS -c cjar -H 'Content-Type: application/json' -d '{"email":"op@example.com","password":"ci password 123"}' localhost:3001/api/auth/signup
          T='{"words":[{"start":0.5,"end":0.9,"text":"hello"},{"start":1,"end":1.3,"text":"um","filler":"hesitation"}],"silences":[]}'
          ID=$( (printf '%s' "$T"; cat sample.webm) | curl -fsS -b cjar -H "x-transcript-length: ${#T}" -H 'x-title: cloud' --data-binary @- localhost:3001/api/videos | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 60); do S=$(curl -fsS -b cjar localhost:3001/api/videos/$ID | python3 -c "import sys,json;print(json.load(sys.stdin)['meta']['status'])"); [ "$S" = ready ] && break; [ "$S" = error ] && exit 1; sleep 2; done
          test "$(curl -fsS -b cjar localhost:3001/api/videos/$ID | python3 -c "import sys,json;print(len(json.load(sys.stdin)['transcript']['words']))")" = 2
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/terms)" = 200
          echo "cloud smoke test passed"
      - if: always()
        run: docker logs recap || true; docker logs cloud || true

      - name: Publish multi-arch image (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RECAP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      # main → :edge (amd64 only, reusing the smoke-tested build cache). Recap Cloud runs this between releases.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: RECAP_VERSION=edge-${{ github.sha }}
          tags: ${{ env.IMAGE }}:edge
          cache-from: type=gha
