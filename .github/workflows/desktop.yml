name: desktop apps

# Builds the all-in-one Recap desktop app (Electron + bundled engine + ffmpeg + whisper.cpp)
# on each OS's own runner. Tags (v*) attach the installers to the GitHub release.
on:
  push:
    branches: [main]
    paths: ["desktop/**", "src/**", "package*.json", "next.config.ts", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-15, args: "--mac --arm64", files: "desktop/dist/Recap-mac-*.dmg" }
          - { name: windows, os: windows-latest, args: "--win --x64", files: "desktop/dist/Recap-windows-*.exe" }
          # 22.04 (glibc 2.35) so the AppImage/whisper binary run on older distros too.
          - { name: linux, os: ubuntu-22.04, args: "--linux --x64", files: "desktop/dist/Recap-linux-*.AppImage\ndesktop/dist/Recap-linux-*.deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        shell: bash
        run: |
          npm ci
          cd desktop && npm ci && node node_modules/electron/install.js

      - name: Bundled binaries (pinned ffmpeg + whisper.cpp built from source)
        shell: bash
        working-directory: desktop
        run: npm run bins

      - name: Engine (Recap server, standalone build)
        shell: bash
        working-directory: desktop
        run: npm run engine

      - name: Package
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Smoke test the packaged app (Linux, headless)
        if: matrix.name == 'linux'
        shell: bash
        working-directory: desktop
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg >/dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i "sine=f=300:d=6" -t 6 -c:v libvpx -c:a libopus /tmp/sample.webm
          mkdir -p /tmp/selftest
          # The app prefers its bundled ffmpeg/whisper-cli (resources/bin) over anything on PATH.
          RECAP_SELFTEST=/tmp/selftest RECAP_SELFTEST_FILE=/tmp/sample.webm \
            timeout 600 xvfb-run -a dist/linux-unpacked/recap-desktop --no-sandbox || true
          cat /tmp/selftest/report.json
          python3 -c "import json,sys; r=json.load(open('/tmp/selftest/report.json')); bad=[s for s in r['steps'] if not s['ok']]; print('FAILED:', bad) if bad else print('all steps passed'); sys.exit(1 if bad else 0)"

      - uses: actions/upload-artifact@v4
        with:
          name: recap-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
