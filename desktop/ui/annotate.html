<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    body.drawing canvas { cursor: crosshair; }
  </style>
</head>
<body>
  <canvas></canvas>
  <script>
    // A see-through layer over the recorded screen: part of the recording on purpose. Clicks pass straight
    // through it (the main process sets that) except in draw mode.
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const INK = "#ff3b30";
    let strokes = [];
    let current = null;
    let ripples = [];
    let frame = 0;

    function size() {
      canvas.width = Math.round(innerWidth * devicePixelRatio);
      canvas.height = Math.round(innerHeight * devicePixelRatio);
      request();
    }
    function paint(now) {
      frame = 0;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.lineCap = ctx.lineJoin = "round";
      ctx.lineWidth = 5;
      ctx.strokeStyle = INK;
      for (const s of strokes) {
        ctx.beginPath();
        s.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        if (s.length === 1) ctx.lineTo(s[0].x + 0.1, s[0].y);
        ctx.stroke();
      }
      ripples = ripples.filter((r) => now - r.at < 550);
      for (const r of ripples) {
        const k = (now - r.at) / 550;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 12 + 30 * k, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = `rgba(255, 196, 0, ${1 - k})`;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(r.x, r.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 196, 0, ${0.35 * (1 - k)})`;
        ctx.fill();
      }
      if (ripples.length) request();
    }
    function request() {
      if (!frame) frame = requestAnimationFrame(paint);
    }
    addEventListener("resize", size);
    size();

    const at = (e) => ({ x: e.clientX, y: e.clientY });
    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture?.(e.pointerId);
      current = [at(e)];
      strokes.push(current);
      request();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!current) return;
      current.push(at(e));
      request();
    });
    const end = () => (current = null);
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", end);

    window.recap.on("annotate", (m) => {
      if (m.type === "click") ripples.push({ x: m.x, y: m.y, at: performance.now() });
      if (m.type === "clear") strokes = [];
      if (m.type === "drawing") document.body.classList.toggle("drawing", m.on);
      request();
    });
  </script>
</body>
</html>
