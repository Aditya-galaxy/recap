name: desktop apps

on:
  push:
    branches: [main]
    paths: ["desktop/**", "mac/**", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  electron:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: "--win --x64", files: "desktop/dist/*.exe" }
          - { name: linux, os: ubuntu-latest, args: "--linux --x64", files: "desktop/dist/*.AppImage\ndesktop/dist/*.deb" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: recap-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}

  macos:
    name: macos
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent build/Recap.app build/Recap-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: recap-macos
          path: mac/build/Recap-macOS.zip
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mac/build/Recap-macOS.zip
