<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: transparent; height: 100%; overflow: hidden; }
    .bar {
      position: absolute; inset: 2px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
      background: #000; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
      -webkit-app-region: drag; user-select: none;
    }
    .bar button {
      -webkit-app-region: no-drag; background: transparent; color: #fff; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 3px; padding: 4px 8px;
    }
    .bar button.primary { background: #fff; color: #000; border-color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .dot.live { animation: blink 1.1s steps(1) infinite; }
    .dot.paused { opacity: 0.35; }
    #time { font-variant-numeric: tabular-nums; }
    .grow { flex: 1; }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <script>
    const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
    const bar = document.getElementById("bar");
    let lastPhase = "";

    function btn(label, action, cls = "", title = "") {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = cls;
      b.title = title;
      b.onclick = () => window.recap.control(action);
      return b;
    }

    window.recap.on("state", (s) => {
      if (s.phase === lastPhase && ["recording", "paused"].includes(s.phase)) {
        document.getElementById("time").textContent = fmt(s.elapsed);
        return;
      }
      lastPhase = s.phase;
      bar.innerHTML = "";
      if (s.phase === "countdown") {
        const t = document.createElement("span");
        t.className = "grow";
        t.textContent = `starting in ${s.countdown}`;
        bar.append(t, btn("cancel", "discard"));
      } else if (s.phase === "recording" || s.phase === "paused") {
        const dot = document.createElement("span");
        dot.className = "dot " + (s.phase === "recording" ? "live" : "paused");
        const time = document.createElement("span");
        time.id = "time";
        time.textContent = fmt(s.elapsed);
        const grow = document.createElement("span");
        grow.className = "grow";
        bar.append(
          dot, time, grow,
          s.phase === "recording" ? btn("❚❚", "pause", "", "Pause") : btn("▶", "resume", "", "Resume"),
          btn("■ stop", "stop", "primary"),
          btn("✕", "discard", "", "Discard"),
        );
      } else {
        bar.textContent = s.phase === "uploading" ? "uploading…" : "saving…";
      }
    });
    window.recap.requestState();
  </script>
</body>
</html>
